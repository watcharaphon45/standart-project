<app-page-header
  eyebrow="ข้อมูลองค์กร / DBRT04"
  title="ข้อมูลฝ่าย"
  description="จัดการฝ่ายภายใต้สาขาของบริษัทที่กำลังทำงาน"
>
  @if (session.canCreate('DBRT04')) {
    <a class="button primary" routerLink="create">+ เพิ่มฝ่าย</a>
  }
</app-page-header>
<section class="card">
  <app-table-toolbar
    searchId="division-keyword"
    searchPlaceholder="ค้นหารหัส หรือชื่อฝ่าย..."
    [(keyword)]="keyword"
    [loading]="loading()"
    [activeFilterCount]="activeFilterCount"
    (search)="search()"
    (resetFilters)="resetFilters()"
  >
    <app-select
      selectId="division-branch-filter"
      label="สาขา"
      name="branchId"
      [clearable]="true"
      [panelMinWidth]="260"
      [options]="branchOptions()"
      [(ngModel)]="branchId"
    />
    <app-select
      selectId="division-status"
      label="สถานะ"
      name="active"
      [clearable]="true"
      [options]="statusOptions"
      [(ngModel)]="active"
    />
  </app-table-toolbar>
  <app-data-table
    [rows]="rows()"
    [columns]="columns"
    caption="รายชื่อฝ่าย"
    [loading]="loading()"
    [failed]="failed()"
    [total]="total()"
    [page]="page"
    [pageSize]="pageSize"
    [sortField]="sortBy"
    [sortDirection]="sortDirection"
    (sort)="sort($event)"
    (retry)="load()"
    (pageChange)="pageTo($event)"
    (pageSizeChange)="resize($event)"
  >
    <ng-template #rowActions let-row>
      <div class="actions">
        @if (row.isActive && session.hasAction('DBRT04', 'UPDATE')) {
          <app-button type="button" (buttonClick)="edit(row.id)">แก้ไข</app-button>
        }
        @if (session.hasAction('DBRT04', row.isActive ? 'DEACTIVATE' : 'ACTIVATE')) {
          <app-button type="button" [disabled]="saving()" [class.row-action-danger]="row.isActive" (buttonClick)="statusById(row.id)">
            {{ row.isActive ? 'ปิดใช้งาน' : 'เปิดใช้งาน' }}
          </app-button>
        }
      </div>
    </ng-template>
  </app-data-table>
</section>
