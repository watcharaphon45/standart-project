<app-page-header
  eyebrow="ข้อมูลองค์กร / DBRT01"
  title="ข้อมูลบริษัท"
  description="ดูแลข้อมูลและสถานะของบริษัทที่กำลังทำงาน"
>
  @if (session.hasGlobal('DBRT01.CREATE')) {
    <a class="button primary" routerLink="create">+ เพิ่มบริษัท</a>
  }
</app-page-header>
<section class="card">
  <app-table-toolbar
    searchId="company-keyword"
    searchPlaceholder="ค้นหารหัส หรือชื่อบริษัท..."
    [(keyword)]="keyword"
    [loading]="loading()"
    [activeFilterCount]="activeFilterCount"
    (search)="search()"
    (resetFilters)="resetFilters()"
  >
    <app-select
      selectId="company-status"
      label="สถานะ"
      name="active"
      [clearable]="true"
      [options]="statusOptions"
      [(ngModel)]="active"
    />
  </app-table-toolbar>
  <app-data-table
    [rows]="rows()"
    [columns]="columns"
    caption="รายชื่อบริษัท"
    [loading]="loading()"
    [failed]="failed()"
    [total]="total()"
    [page]="page"
    [pageSize]="pageSize"
    [sortField]="sortBy"
    [sortDirection]="sortDirection"
    (sort)="sort($event)"
    (retry)="load()"
    (pageChange)="pageTo($event)"
    (pageSizeChange)="resize($event)"
  >
    <ng-template #rowActions let-row>
      <div class="actions">
        @if (row.isActive && session.has('DBRT01.UPDATE')) {
          <a class="button" routerLink="edit">แก้ไข</a>
        }
        @if (session.has(row.isActive ? 'DBRT01.DEACTIVATE' : 'DBRT01.ACTIVATE')) {
          <app-button type="button" [disabled]="saving()" [class.row-action-danger]="row.isActive" (buttonClick)="statusById(row.id)">
            {{ row.isActive ? 'ปิดใช้งาน' : 'เปิดใช้งาน' }}
          </app-button>
        }
      </div>
    </ng-template>
  </app-data-table>
</section>
