<main class="auth">
  <section class="card">
    @if (session.user() && !session.user()?.mustChangePassword) {
      <a class="back-link" routerLink="/db/dbrt01">← กลับหน้าหลัก</a>
    }
    <h1>เปลี่ยนรหัสผ่าน</h1>
    <p>ตั้งรหัสส่วนตัวก่อนเข้าใช้งานระบบ ใช้วลีและช่องว่างได้ 15–128 ตัวอักษร</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <app-input
        inputId="current"
        label="รหัสผ่านปัจจุบัน"
        type="password"
        formControlName="currentPassword"
        autocomplete="current-password"
        [error]="errors.message(form, 'currentPassword')"
        [invalid]="form.controls.currentPassword.touched && form.controls.currentPassword.invalid"
      />
      <app-input
        inputId="new"
        label="รหัสผ่านใหม่"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        [error]="errors.message(form, 'newPassword')"
        [invalid]="form.controls.newPassword.touched && form.controls.newPassword.invalid"
      />
      <app-input
        inputId="confirmation"
        label="ยืนยันรหัสใหม่"
        type="password"
        formControlName="confirmation"
        autocomplete="new-password"
        [error]="errors.message(form, 'confirmation')"
        [invalid]="form.controls.confirmation.touched && form.controls.confirmation.invalid"
      />
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <app-button type="submit" variant="primary" [loading]="busy()">
        {{ busy() ? 'กำลังบันทึก…' : 'เปลี่ยนรหัสผ่าน' }}
      </app-button>
    </form>
  </section>
</main>
