<app-page-header
  eyebrow="ผู้ดูแลระบบ / SURT04"
  title="ขอบเขตผู้ใช้งาน"
  description="กำหนดบทบาทและขอบเขตระดับบริษัท สาขา หรือแผนก (1 บทบาทต่อผู้ใช้ต่อบริษัท)"
/>
<section class="card">
  <app-table-toolbar
    searchId="scope-keyword"
    searchPlaceholder="ค้นหาชื่อผู้ใช้งาน, อีเมล หรือบทบาท..."
    [(keyword)]="keyword"
    [loading]="loading()"
    [activeFilterCount]="activeFilterCount"
    (search)="search()"
    (resetFilters)="resetFilters()"
  >
    <app-select
      selectId="scope-type-filter"
      label="ขอบเขต"
      name="scopeType"
      [clearable]="true"
      [options]="scopeFilterOptions"
      [(ngModel)]="scopeType"
    />
    <app-select
      selectId="scope-status-filter"
      label="สถานะ"
      name="active"
      [clearable]="true"
      [options]="statusOptions"
      [(ngModel)]="active"
    />
  </app-table-toolbar>
  <app-data-table
    [rows]="rows()"
    [columns]="columns"
    caption="รายชื่อผู้ใช้งานและขอบเขตในบริษัท"
    [loading]="loading()"
    [failed]="failed()"
    [total]="total()"
    [page]="page"
    [pageSize]="pageSize"
    [sortField]="sortBy"
    [sortDirection]="sortDirection"
    (sort)="sort($event)"
    (retry)="load()"
    (pageChange)="pageTo($event)"
    (pageSizeChange)="resize($event)"
  >
    <ng-template #rowActions let-row>
      <div class="actions">
        @if (session.hasAction('SURT04', 'UPDATE')) {
          <app-button type="button" (buttonClick)="edit(row.id)">กำหนดขอบเขต</app-button>
        }
      </div>
    </ng-template>
  </app-data-table>
</section>
