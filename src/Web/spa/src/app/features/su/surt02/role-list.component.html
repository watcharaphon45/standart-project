<app-page-header
  eyebrow="ผู้ดูแลระบบ / SURT02"
  title="ข้อมูลบทบาท"
  description="จัดการบทบาทประจำบริษัทและบทบาทส่วนกลาง (1 บทบาทต่อผู้ใช้ต่อบริษัท)"
>
  @if (session.canCreate('SURT02')) {
    <a class="button primary" routerLink="create">+ เพิ่มบทบาท</a>
  }
</app-page-header>
<section class="card">
  <app-table-toolbar
    searchId="role-keyword"
    searchPlaceholder="ค้นหารหัส หรือชื่อบทบาท..."
    [(keyword)]="keyword"
    [loading]="loading()"
    [activeFilterCount]="activeFilterCount"
    (search)="search()"
    (resetFilters)="resetFilters()"
  >
    @if (session.hasGlobal('SURT02.VIEW')) {
      <app-select
        selectId="role-scope-mode"
        label="ขอบเขต"
        name="scopeMode"
        [options]="scopeOptions"
        [value]="scopeMode()"
        (valueChange)="onScopeChange($event)"
      />
    }
    <app-select
      selectId="role-status"
      label="สถานะ"
      name="active"
      [clearable]="true"
      [options]="statusOptions"
      [(ngModel)]="active"
    />
  </app-table-toolbar>
  <app-data-table
    [rows]="rows()"
    [columns]="columns"
    caption="รายชื่อบทบาท"
    [loading]="loading()"
    [failed]="failed()"
    [total]="total()"
    [page]="page"
    [pageSize]="pageSize"
    [sortField]="sortBy"
    [sortDirection]="sortDirection"
    (sort)="sort($event)"
    (retry)="load()"
    (pageChange)="pageTo($event)"
    (pageSizeChange)="resize($event)"
  >
    <ng-template #rowActions let-row>
      <div class="actions">
        @if (row.isActive && session.hasAction('SURT02', 'UPDATE')) {
          <app-button type="button" (buttonClick)="edit(row.id)">แก้ไข</app-button>
        }
        @if (session.hasAction('SURT02', row.isActive ? 'DEACTIVATE' : 'ACTIVATE')) {
          <app-button type="button" [disabled]="saving()" [class.row-action-danger]="row.isActive" (buttonClick)="statusById(row.id)">
            {{ row.isActive ? 'ปิดใช้งาน' : 'เปิดใช้งาน' }}
          </app-button>
        }
      </div>
    </ng-template>
  </app-data-table>
</section>
