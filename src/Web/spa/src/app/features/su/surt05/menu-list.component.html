<app-page-header
  eyebrow="ผู้ดูแลระบบ / SURT05"
  title="ตั้งค่าเมนู"
  description="ปรับชื่อแสดงผล ลำดับ และสถานะการแสดงผลเมนูในแถบนำทาง (ไม่เปลี่ยนสิทธิ์ Backend)"
/>
<section class="card">
  <app-table-toolbar
    searchId="menu-keyword"
    searchPlaceholder="ค้นหารหัส หรือชื่อเมนู..."
    [(keyword)]="keyword"
    [loading]="loading()"
    [activeFilterCount]="activeFilterCount"
    (search)="search()"
    (resetFilters)="resetFilters()"
  >
    <app-select
      selectId="menu-module-filter"
      label="โมดูล"
      name="moduleCode"
      [clearable]="true"
      [options]="moduleOptions"
      [(ngModel)]="moduleCode"
    />
    <app-select
      selectId="menu-status"
      label="สถานะ"
      name="active"
      [clearable]="true"
      [options]="statusOptions"
      [(ngModel)]="active"
    />
  </app-table-toolbar>
  <app-data-table
    [rows]="rows()"
    [columns]="columns"
    caption="รายการเมนูระบบ"
    [loading]="loading()"
    [failed]="failed()"
    [total]="total()"
    [page]="page"
    [pageSize]="pageSize"
    [sortField]="sortBy"
    [sortDirection]="sortDirection"
    (sort)="sort($event)"
    (retry)="load()"
    (pageChange)="pageTo($event)"
    (pageSizeChange)="resize($event)"
  >
    <ng-template #rowActions let-row>
      <div class="actions">
        @if (session.hasAction('SURT05', 'UPDATE')) {
          <app-button type="button" (buttonClick)="edit(row.id)">แก้ไข</app-button>
        }
        @if (session.hasAction('SURT05', row.isActive ? 'DEACTIVATE' : 'ACTIVATE')) {
          <app-button type="button" [disabled]="saving()" [class.row-action-danger]="row.isActive" (buttonClick)="statusById(row.id)">
            {{ row.isActive ? 'ซ่อนเมนู' : 'แสดงเมนู' }}
          </app-button>
        }
      </div>
    </ng-template>
  </app-data-table>
</section>
