<fieldset
  [disabled]="isDisabled()"
  [attr.aria-invalid]="isInvalid() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
>
  @if (legend()) {
    <legend>
      {{ legend() }}@if (required()) { <span class="required" aria-hidden="true">*</span> }
    </legend>
  }
  <div class="options">
    @for (option of options(); track option.value; let i = $index) {
      <label class="radio-option" [for]="optionId(i)" [class.disabled]="isDisabled() || !!option.disabled">
        <input
          type="radio"
          [id]="optionId(i)"
          [name]="name()"
          [value]="option.value"
          [checked]="value() === option.value"
          [required]="required()"
          [disabled]="isDisabled() || !!option.disabled"
          (change)="selectOption(option.value)"
          (blur)="onBlur()"
        />
        <span class="option-text">
          <span class="option-label">{{ option.label }}</span>
          @if (option.description) {
            <small class="option-description">{{ option.description }}</small>
          }
        </span>
      </label>
    }
  </div>
  @if (hint()) {
    <small [id]="baseId() + '-help'">{{ hint() }}</small>
  }
  @if (error()) {
    <p [id]="baseId() + '-error'" class="error">{{ error() }}</p>
  }
</fieldset>
